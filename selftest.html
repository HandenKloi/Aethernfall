<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Aethernfall v3.2 REALFIX</title>
<body style="font-family:system-ui;background:#0e1513;color:#eee;padding:20px"><h2>Aethernfall v3.2 REALFIX</h2><pre id=o>Checking…</pre>
<script>
Promise.all([fetch('./game.js?v=3200',{cache:'no-store'}),fetch('./sw.js?v=3200',{cache:'no-store'})]).then(async rs=>{
 const j=await rs[0].text(),sw=await rs[1].text();
 const t=[
 ['lastFrame declaration',/\blastFrame\s*=\s*0\b/.test(j)],
 ['joy declared before touch registration',j.indexOf("const joyEl=")<j.indexOf("joyEl.addEventListener('touchstart'")],
 ['pointer joystick',j.includes("joyEl.addEventListener('pointerdown'")],
 ['no touch joystick fallback',!j.includes("joyEl.addEventListener('touchstart'")],
 ['mouse guard is scoped',j.includes("e.pointerType==='mouse'")],
 ['dodge state',j.includes('dodgeUntil:0')&&j.includes('Number.isFinite(player.dodgeUntil)')],
 ['mob movement',j.includes('updateEnemyPatrol(dt)')],
 ['real FPS monitor',j.includes('updatePerformanceMonitor(nowTime,renderMs,frameTimeMs)')],
 ['FPS limiter',j.includes('const interval=1000/fpsTarget')],
 ['no dynamic resolution',!j.includes('dprCap')&&!j.includes('adaptiveScale,')],
 ['service worker',sw.includes('aethernfall-v32')],
 ['three zones',j.includes('mistwood')&&j.includes('stonevale')&&j.includes('ashfield')]
 ];
 o.textContent=t.map(x=>(x[1]?'PASS ':'FAIL ')+x[0]).join('\n')
}).catch(e=>o.textContent='FAIL '+e)
</script>
