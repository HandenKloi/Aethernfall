<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self';">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#101817">
<title>Aethernfall v3.8.3</title>
<link rel="manifest" href="manifest.json?v=3.8.3">
<link rel="stylesheet" href="style.css?v=3.8.3">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="icon" href="assets/icon-192.png">
<meta name="apple-mobile-web-app-title" content="Aethernfall">
</head>
<body>
<canvas id="game">
</canvas>
<div id="vignette">
</div>
<header class="hudTop">
<section class="panel heroPanel">
<div class="portrait">
<svg viewBox="170 8 190 185" aria-hidden="true"><image href="assets/art/characters.webp" width="1536" height="1024"/></svg>
</div>
<div class="heroMeta">
<div class="heroLine">
<b>Ari</b>
<span id="levelText">Ур. 6</span>
</div>
<div class="bar hp">
<span id="hpFill">
</span>
</div>
<div class="bar stamina">
<span id="staminaFill">
</span>
</div>
<div class="bar xp">
<span id="xpFill">
</span>
</div>
</div>
</section>
<section class="panel zonePanel">
<span class="eyebrow">ТЕКУЩАЯ ЗОНА</span>
<b id="zoneText">Туманный лес</b>
<span id="objectiveText">Поговорите с разведчиком</span>
</section>
<div class="topActions">
<button class="topBtn roundBtn" id="inventoryBtn" aria-label="Сумка" title="Сумка"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5V3h8v2M6 6q6-4 12 0l2 14H4zM5 11h14M8 14h8v4H8zM2 10v8M22 10v8"/></svg></button>
<button class="topBtn roundBtn" id="questsBtn" aria-label="Задания" title="Задания"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h13q3 0 3 3h-6M6 4q-3 0-3 3v2h4M6 4v13q0 3 3 3h10q-3 0-3-3V7M9 8h4M9 11h4M9 14h4M6 17h10"/></svg></button>
<button class="topBtn roundBtn" id="shopBtn" aria-label="Магазин" title="Магазин"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v11h16V10M3 10l2-7h14l2 7M3 10q3 4 6 0 3 4 6 0 3 4 6 0M9 21v-7h6v7"/></svg></button>
<button class="topBtn roundBtn" id="menuBtn" aria-label="Меню" title="Меню"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
</div>
</header>
<section id="questTracker" class="panel collapsed">
<button id="questToggle" aria-expanded="false" aria-controls="questProgress"><b id="questTitle">Следы в тумане</b><span id="questChevron" aria-hidden="true">›</span></button>
<span id="questProgress">Поговорите с разведчиком</span>
</section>
<section id="minimapFrame" class="panel">
<canvas id="minimap" width="240" height="240">
</canvas>
<span id="zoneBadge">ЛЕС</span>
</section>
<div id="resourceHud" class="panel">
<span>🌿 <b id="herbCount">0</b>
</span>
<span>🪵 <b id="woodCount">0</b>
</span>
<span>⛏ <b id="oreCount">0</b>
</span>
<span>✦ <b id="goldCount">125</b>
</span>
</div>
<div id="netPill" class="netPill">● OFFLINE</div>
<button id="savePill" class="savePill hidden" type="button" aria-live="polite"></button>
<div id="perfPill" class="perfPill hidden">
<span id="perfPillFps">--</span> FPS · <span id="perfPillMs">--</span> ms</div>
<div id="lootTicker" class="lootTicker">
</div>

<div id="joystick" class="joystick">
<div class="joyRing">
</div>
<div id="stick">
</div>
</div>
<div class="actions">
<button id="supplyBtn" class="action supply" data-act="supply" aria-label="Использовать выбранный расходник"><span id="supplyLabel">ЗЕЛЬЕ · 0</span><b>⚗</b></button>
<button id="actionUse" class="action use" data-act="use">
<small id="actionLabel">ДЕЙСТВИЕ</small>
<b>✦</b>
</button>
<button id="skill1Btn" class="action skill" data-act="skill1" aria-label="Разрез ветра, 20 выносливости">
<small>РАЗРЕЗ</small><span class="actionMeta" id="skill1Meta">20 EN</span>
<b>Ⅰ</b>
</button>
<button id="skill2Btn" class="action skill" data-act="skill2" aria-label="Тройной импульс, 20 выносливости">
<small>ИМПУЛЬС</small><span class="actionMeta" id="skill2Meta">20 EN</span>
<b>Ⅱ</b>
</button>
<button id="skill3Btn" class="action skill" data-act="skill3" aria-label="Второе дыхание, 20 выносливости, восстановление 8 секунд">
<small>ДЫХАНИЕ</small><span class="actionMeta" id="skill3Meta">20 EN</span>
<b>Ⅲ</b>
</button>
<button class="action block" data-act="block">
<small>БЛОК</small>
<b>◈</b>
</button>
<button id="dodgeBtn" class="action dodge" data-act="dodge" aria-label="Уклонение, 24 выносливости">
<small>УКЛОН</small><span class="actionMeta" id="dodgeMeta">24 EN</span>
<b>↝</b>
</button>
<button class="action attack" data-act="attack">
<small>АТАКА</small>
<b>⚔</b>
</button>
</div>
<div id="toast" role="status" aria-live="polite">
</div>
<button id="updateBtn" class="hidden">Обновить игру</button>

<div id="modal" class="hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
<div class="modalCard panel">
<div class="modalHead">
<div>
<span class="eyebrow">AETHERNFALL</span>
<b id="modalTitle">Меню</b>
</div>
<button id="modalClose" aria-label="Закрыть">×</button>
</div>
<div id="modalBody" class="modalBody">
</div>
</div>
</div>
<div id="loadingOverlay">
<div class="loadingCard panel">
<div class="loadingMark">A</div>
<b id="loadText">Загрузка Aethernfall</b>
<div class="loadBar">
<span id="loadFill">
</span>
</div>
</div>
</div>
<script src="physics.js?v=3.8.3" defer></script>
<script src="art.js?v=3.8.3" defer></script>
<script src="game.js?v=3.8.3" defer>
</script>
<div id="perfMonitor" class="perfMonitor hidden" aria-live="polite">
  <div>
<b id="perfFps">-- FPS</b>
<span id="perfTarget"> target --</span>
</div>
  <div>
<span id="perfFrame">-- ms frame</span>
<span id="perfRender"> · -- ms render</span>
</div>
  <div>
<span id="perfScale">Scale 1.00</span>
<span id="perfDevice"> · Mobile</span>
</div>
</div>

</body>
</html>
